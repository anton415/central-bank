name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run quality gate
        run: ./mvnw --batch-mode --no-transfer-progress verify
